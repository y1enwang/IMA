<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cabinet of Curiosity</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="museumBackground" aria-hidden="true"></div>

  <main>

    <h1>Cabinet of Curiosity</h1>

    <p>
      Choose one thing you are curious about.
      Then open the mystery box.
    </p>

    <div class="choices">
      <button class="choice" data-word="bird">Birds</button>
      <button class="choice" data-word="mushroom">Mushrooms</button>
      <button class="choice" data-word="flower">Flowers</button>
      <button class="choice" data-word="mask">Masks</button>
      <button class="choice" data-word="ocean">Ocean</button>
      <button class="choice" data-word="gold">Gold</button>
      <button class="choice" data-word="dream">Dreams</button>
      <button class="choice" data-word="tree">Trees</button>
    </div>

    <form id="customClueForm">
      <label for="customClue">Add your own clues</label>
      <input id="customClue" type="text" placeholder="e.g. moon, ocean, dragon" maxlength="80" required>
      <button type="submit">Use my clue</button>
    </form>

    <p id="selectedWord">
      Selected: none
    </p>

    <button id="mysteryBox">
      ? Open Mystery Box
    </button>

    <p id="status" role="status"></p>

    <section id="result" aria-label="Your discoveries">
    <article class="artworkCard" id="firstCard">

      <img id="artworkImage" src="" alt="Artwork from The Met">

      <h2 id="artworkTitle"></h2>

      <p id="artworkDate"></p>

      <p id="artworkMedium"></p>

      <a id="artworkLink" href="#" target="_blank">
        View on The Met website
      </a>

    </article>
    <div id="moreResults"></div>
    </section>

    <section id="collection">
      <h2>My Collection <span id="collectionCount">(0)</span></h2>
      <p>Keep your discoveries here. Saved in this browser.</p>
      <button id="exportCollection">Download collection</button>
      <p id="collectionStatus" role="status"></p>
      <div id="collectionCards"></div>
    </section>

  </main>

  <script src="script.js"></script>

</body>

</html>
