<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>She Won't Sleep</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>
    <h1>She Won't Sleep</h1>

    <p id="sentence1">
      I had no idea why my five-year-old daughter refused to sleep at night.
    </p>

    <div id="room">
      <div class="moon"></div>

      <div class="bed">
        <div class="pillow"></div>
        <div class="blanket"></div>
      </div>

      <div class="child-head"></div>

      <div id="corner">
        <div id="lady">
          <div class="hair"></div>

          <div class="face">
            <div class="eye eye-left"></div>
            <div class="eye eye-right"></div>
          </div>

          <div class="dress"></div>
          <div class="hand">✋</div>
        </div>
      </div>
    </div>

    <p id="sentence2">
      One night, she finally whispered,
      “Mom, why does the lady with long hair keep waving at me from the corner of my room?”
    </p>

  </main>

  <script src="script.js"></script>
</body>
</html>
