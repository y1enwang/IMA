<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ORBITRON PONG</title>
  <!-- Futuristic / Cyberpunk Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      min-height: 100vh;
      background: #02050f;
      color: #00d9ff;
      font-family: 'Orbitron', sans-serif;
      text-align: center;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Subtle Animated TRON Digital Grid Background */
    .bg-grid {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        linear-gradient(90deg, rgba(0, 217, 255, 0.05) 1px, transparent 1px),
        linear-gradient(rgba(0, 217, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: moveGrid 12s linear infinite;
      z-index: -2;
    }

    /* Subtle Glow Ambient Background Pulse */
    .bg-glow {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 700px; height: 500px;
      background: radial-gradient(circle, rgba(0, 162, 255, 0.12) 0%, rgba(2, 5, 15, 0) 70%);
      z-index: -1;
      pointer-events: none;
    }

    @keyframes moveGrid {
      0% { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    h1 {
      font-size: 36px;
      font-weight: 900;
      margin: 10px 0 20px;
      color: #ffffff;
      text-shadow: 
        0 0 10px #00d9ff,
        0 0 20px #00d9ff,
        0 0 40px #0077ff;
      letter-spacing: 6px;
    }

    .canvas-container {
      position: relative;
      display: inline-block;
      margin: 0 auto;
      border: 2px solid #00d9ff;
      box-shadow: 
        0 0 15px rgba(0, 217, 255, 0.5),
        inset 0 0 20px rgba(0, 217, 255, 0.25);
      background: rgba(0, 8, 20, 0.9);
      border-radius: 4px;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 600px;
      height: auto;
      background: transparent;
    }

    p {
      font-size: 11px;
      letter-spacing: 1.5px;
      margin: 14px 0;
      color: #88e7ff;
      text-shadow: 0 0 8px rgba(0, 217, 255, 0.6);
    }

    button {
      padding: 12px 24px;
      border: 1px solid #00d9ff;
      background: rgba(0, 25, 50, 0.7);
      color: #00d9ff;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 217, 255, 0.3);
      transition: all 0.2s ease;
      text-transform: uppercase;
      border-radius: 2px;
    }

    button:hover:not(:disabled) {
      background: #00d9ff;
      color: #000;
      box-shadow: 0 0 20px #00d9ff;
    }

    button:disabled {
      opacity: 0.3;
      cursor: default;
      box-shadow: none;
      border-color: #005577;
    }

    .controls-info {
      color: #00a2ff;
      font-size: 10px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <h1>ORBITRON</h1>
  
  <div class="canvas-container">
    <canvas id="game" width="600" height="400"></canvas>
  </div>

  <p id="role">CONNECTING...</p>
  <p id="status">WAITING FOR PROGRAM GRID...</p>

  <div>
    <button id="start" type="button" disabled>INITIALIZE</button>
  </div>
  
  <div style="margin-top: 15px;">
    <button id="removeBall" type="button" disabled>- DISC</button>
    <span id="ballCount" style="margin: 0 15px; font-size: 11px; color: #00d9ff;">DISCS: 1</span>
    <button id="addBall" type="button" disabled>+ DISC</button>
  </div>

  <p class="controls-info">USER LEFT: W / S &nbsp;&nbsp; USER RIGHT: ▲ / ▼</p>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const ctx = document.getElementById("game").getContext("2d");
    const startButton = document.getElementById("start");
    const status = document.getElementById("status");
    const addBallButton = document.getElementById("addBall");
    const removeBallButton = document.getElementById("removeBall");
    const ballCountLabel = document.getElementById("ballCount");
    const bgm = new Audio("/assets/bgm.mp3");
    const winSound = new Audio("/assets/win.mp3");
    const failSound = new Audio("/assets/fail.mp3");
    const reboundSound = new Audio("/assets/rebound.mp3");
    const held = new Set();
    let role = "spectator";
    let lastMove = 0;
    let resultPlayed = false;
    let resultPlaying = false;
    bgm.loop = true;
    bgm.volume = 0.2;
    reboundSound.volume = 1.0;

    function playBgm() {
      if (resultPlaying || !bgm.paused) return;
      bgm.play().catch(() => {});
    }

    function playResult(winner) {
      if (role === "spectator") return;
      const sound = winner === role ? winSound : failSound;
      resultPlaying = true;
      bgm.pause();
      sound.currentTime = 0;
      sound.play().catch(() => {
        resultPlaying = false;
        playBgm();
      });
    }

    for (const sound of [winSound, failSound]) {
      sound.addEventListener("ended", () => {
        resultPlaying = false;
        playBgm();
      });
    }

    playBgm();
    document.addEventListener("click", playBgm);

    socket.on("role", (side) => {
      role = side;
      document.getElementById("role").textContent = "IDENTITY: " + side.toUpperCase();
      lastMove = 0;
    });

    socket.on("rebound", () => {
      reboundSound.currentTime = 0;
      reboundSound.play().catch(() => {});
    });

    socket.on("state", (game) => {
      const count = game.balls ? game.balls.length : 1;
      ballCountLabel.textContent = `DISCS: ${count}`;
      addBallButton.disabled = role === "spectator" || count >= 20;
      removeBallButton.disabled = role === "spectator" || count <= 1;

      if (!game.gameOver) resultPlayed = false;
      else if (!resultPlayed) {
        resultPlayed = true;
        playResult(game.winner);
      }

      const isReady = role !== "spectator" && game.ready[role];
      if (game.playing) status.textContent = "GRID ACTIVE";
      else if (!game.connected) status.textContent = "WAITING FOR TWO USERS...";
      else if (game.gameOver) {
        status.textContent = game.winner.toUpperCase() + " WINS! " +
          (isReady ? "WAITING FOR OPPONENT..." : "PRESS INITIALIZE TO REPLAY");
      } else if (role === "spectator") status.textContent = "SPECTATING GRID...";
      else status.textContent = isReady ? "READY! WAITING FOR OPPONENT..." : "PRESS INITIALIZE WHEN READY";

      startButton.textContent = game.playing ? "GRID ACTIVE..." :
        game.gameOver ? (isReady ? "READY..." : "RE-INITIALIZE") :
        isReady ? "READY..." : "INITIALIZE";
      startButton.disabled = role === "spectator" || !game.connected || game.playing || isReady;
      draw(game);
    });

    startButton.addEventListener("click", () => {
      startButton.disabled = true;
      socket.emit("start");
    });

    addBallButton.addEventListener("click", () => socket.emit("changeBallCount", 1));
    removeBallButton.addEventListener("click", () => socket.emit("changeBallCount", -1));

    function draw(game) {
      // Clear canvas with deep transparent dark blue
      ctx.clearRect(0, 0, 600, 400);

      // In-canvas delicate grid lines
      ctx.strokeStyle = "rgba(0, 217, 255, 0.07)";
      ctx.lineWidth = 1;
      for (let x = 0; x <= 600; x += 30) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 400); ctx.stroke();
      }
      for (let y = 0; y <= 400; y += 30) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(600, y); ctx.stroke();
      }

      // TRON Center Divider (Cyan Glow)
      ctx.strokeStyle = "#00d9ff";
      ctx.shadowColor = "#00d9ff";
      ctx.shadowBlur = 10;
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 12]);
      ctx.beginPath();
      ctx.moveTo(300, 0);
      ctx.lineTo(300, 400);
      ctx.stroke();
      ctx.setLineDash([]); // Reset line dash

      // Holographic Scores
      ctx.font = '700 28px "Orbitron", sans-serif';
      ctx.textAlign = "center";
      
      // Left Score (Cyan Light)
      ctx.fillStyle = "#00d9ff";
      ctx.shadowColor = "#00d9ff";
      ctx.shadowBlur = 12;
      ctx.fillText(game.score.left, 210, 45);

      // Right Score (red Light)
      ctx.fillStyle = "#ff0037";
      ctx.shadowColor = "#ff0037";    
      ctx.shadowBlur = 12;
      ctx.fillText(game.score.right, 390, 45);

      // Left Paddle (Cyan Light Cycle Trail)
      ctx.fillStyle = "#00d9ff";
      ctx.shadowColor = "#00d9ff";
      ctx.shadowBlur = 16;
      ctx.fillRect(20, game.paddles.left, 10, 80);

      // Right Paddle (red Trail)
      ctx.fillStyle = "#ff0037";
      ctx.shadowColor = "#ff0037";  
      ctx.shadowBlur = 16;
      ctx.fillRect(570, game.paddles.right, 10, 80);

      // Energy Discs (Balls)
      if (game.balls) {
        game.balls.forEach((ball) => {
          ctx.fillStyle = "#ffffff";
          ctx.shadowColor = "#00d9ff";
          ctx.shadowBlur = 18;
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, 7, 0, Math.PI * 2);
          ctx.fill();

          // Outer Disc Ring Effect
          ctx.strokeStyle = "#00d9ff";
          ctx.lineWidth = 2;
          ctx.stroke();
        });
      }

      // Reset Glow
      ctx.shadowBlur = 0;
    }

    function sendMove() {
      let direction = 0;
      if (role === "left") direction = Number(held.has("s")) - Number(held.has("w"));
      if (role === "right") direction = Number(held.has("ArrowDown")) - Number(held.has("ArrowUp"));
      if (direction !== lastMove) {
        lastMove = direction;
        socket.emit("move", direction);
      }
    }

    function handleKey(e, down) {
      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (!["w", "s", "ArrowUp", "ArrowDown"].includes(key)) return;
      e.preventDefault();
      if (down) held.add(key);
      else held.delete(key);
      sendMove();
    }
    document.addEventListener("keydown", e => handleKey(e, true));
    document.addEventListener("keyup", e => handleKey(e, false));
    window.addEventListener("blur", () => { held.clear(); sendMove(); });
  </script>
</body>
</html>
